# ==============================================================================
# STRANGER BUILDS 2026 - RENDER BLUEPRINT DEPLOYMENT SPECIFICATION
# Deploy via: Render Dashboard -> Blueprints -> Connect https://github.com/mohammedsafwankhan/TrueForge-.git
# ==============================================================================

services:
  - type: web
    name: trueforge-stranger-builds
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python run_production.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: AGENT_NAME
        value: stranger_builds_primary_agent
      - key: AGENT_NETWORK
        value: mainnet
      - key: AGENT_VERSION
        value: 0.3.0
      - key: LOG_LEVEL
        value: INFO
      - key: ASI1_MODEL
        value: asi1-mini
      - key: ASI1_API_BASE
        value: https://api.asi1.ai/v1
      - key: MESSAGE_DEDUPLICATION_TTL_SECONDS
        value: "3600"
      - key: SESSION_EXPIRY_SECONDS
        value: "86400"
